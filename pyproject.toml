[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deephedging-jax-ntbn"
version = "1.0.0"
description = "JAX Deep Hedging with No-Transaction Band Network (NTBN) across 7 notebook groups at original scale"
readme = "README.md"
authors = [{ name = "thanhbien10a4-ui", email = "thanhbien10a4@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.7.0",
]
